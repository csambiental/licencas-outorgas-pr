name: Atualizar mineração (ANM) e risco geológico (SGB)
on: { workflow_dispatch: {} }
permissions: { contents: write, actions: write }
concurrency: { group: dados, cancel-in-progress: false }
jobs:
  mr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: dados, path: saida }
      - run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y build-essential libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe && make -s -C /tmp/tippecanoe -j4 && sudo make -s -C /tmp/tippecanoe install
      - run: |
          pip install -q cryptography shapely
          python3 tools/mineracao_risco.py saida
          rm -rf saida/tiles_mr
          tippecanoe -e saida/tiles_mr --no-tile-compression --force -Z6 -z13 --drop-densest-as-needed --coalesce-densest-as-needed -L min:saida/min.geojson -L rsk:saida/rsk.geojson -L sit:saida/sit.geojson -L com:saida/com.geojson
          rm -f saida/min.geojson saida/rsk.geojson saida/sit.geojson saida/com.geojson; du -sh saida/tiles_mr
      - run: |
          cd saida
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Mineração e risco geológico $(date +%d/%m/%Y)" && git push -q origin dados
      - run: gh workflow run publicar.yml -R ${{ github.repository }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
