name: Atualizar dados (licenças e outorgas do PR)
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 7 4 * *'   # todo dia 4, 04h17 (Brasília)
permissions:
  contents: write
  actions: write
concurrency: { group: dados, cancel-in-progress: false }
jobs:
  dados:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          pip install --quiet shapely
          sudo apt-get -qq update && sudo apt-get -qq install -y build-essential libsqlite3-dev zlib1g-dev
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe && make -s -C /tmp/tippecanoe -j4 && sudo make -s -C /tmp/tippecanoe install
      - name: Baixar e processar (IAT – SGA/SIA e SIGARH)
        run: python3 tools/processar.py saida
      - name: Contatos das empresas (criptografados – uso interno CS)
        env: { CONTATOS_SENHA: "${{ secrets.CONTATOS_SENHA }}" }
        run: |
          pip install --quiet cryptography
          python3 tools/contatos_cripto.py saida
      - name: Gerar mosaicos de pontos
        run: |
          tippecanoe -e saida/tiles --no-tile-compression --force -Z6 -z13 -B10 -r1.7 --drop-densest-as-needed --extend-zooms-if-still-dropping \
            -L lic:saida/pontos_lic.geojson -L out:saida/pontos_out.geojson
          rm saida/pontos_lic.geojson saida/pontos_out.geojson
          du -sh saida; find saida -type f | wc -l
      - name: Gravar no ramo "dados" (um único commit, sem histórico)
        run: |
          cd saida
          git init -q -b dados
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Dados de $(date +%d/%m/%Y)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados
      - name: Publicar o site
        run: gh workflow run publicar.yml -R ${{ github.repository }}
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
