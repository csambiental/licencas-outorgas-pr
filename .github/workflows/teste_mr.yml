name: Teste camadas mineração/risco/patrimônio
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: dados, path: data }
      - run: |
          pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
          mkdir -p saida_teste; python3 -m http.server 8765 >/dev/null 2>&1 & sleep 2
          python3 tools/teste_mr.py || true
      - run: |
          cd saida_teste && git init -q -b teste-mr && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m teste && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" teste-mr
